[workspace]
resolver = "3"
members = ["apps/app", "apps/app/data", "apps/app/kit", "crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
gpui-kit = { version = "0.8.0", features = ["gpui-fast"] }
# apps/app's icon, where the app sets it itself: the X11 window's, and the Dock's on macOS (see
# `apps/app/src/identity.rs`); and on Windows, the one built into the .exe (`apps/app/build.rs`).
image = { version = "0.25.10", default-features = false, features = ["png"] }
objc2 = "0.6.5"
objc2-app-kit = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSApplication",
  "NSImage",
  "NSResponder",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSData"] }
winresource = "0.1.34"

# crates/git: async without tokio (GPUI runs its own executor), with what the features need.
async-channel = "2.5.0"
async-fs = "2.2.0"
async-io = "2.6.0"
async-process = "2.5.0"
blocking = "1.7.0"
dunce = "1.0.5"
event-listener = "5.4.2"
# Without the executor and its thread pool: tasks run on smol's, or the caller's.
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
futures-lite = "2.6.1"
libc = "0.2.191"
log = { version = "0.4.34", features = ["std"] }
memchr = "2.8.3"
notify = "8.2.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = { version = "1.0.1", features = ["std"] }
smol = "2.0.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4", "v7"] }

# crates/db: Gitto's SQLite database, and where it's kept.
dirs = "6.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# apps/app: the GPUI app.
anyhow = "1.0.104"

# apps/app's diffs: syntax highlighting as gpui-kit's `syntect` feature does it (the same syntect
# and syntax set), and the words that changed between a removed line and the line added for it
# (and, in crates/ui-logic, the diff of two whole files). The regexes are Oniguruma's (`regex-onig`,
# which syntect takes over `regex-fancy`, which gpui-kit asks for): it parses a file about three
# times as fast, so a diff's colors don't lag its text.
similar = "2.7.0"
syntect = { version = "5.3.0", default-features = false, features = [
  "parsing",
  "default-syntaxes",
  "regex-fancy",
  "regex-onig",
] }
two-face = { version = "0.4.5", default-features = false, features = [
  "syntect-fancy",
  "syntect-onig",
] }

# crates/ui-logic: what the UI works out for itself, e.g. the order of the sidebar's folders.
indexmap = "2.14.2"
url = "2.5.8"

gitto-db = { path = "crates/db" }
gitto-git = { path = "crates/git" }
gitto-repository = { path = "crates/repository" }
gitto-ui-logic = { path = "crates/ui-logic" }
gitto-app-data = { path = "apps/app/data" }
gitto-app-kit = { path = "apps/app/kit" }

# Dependencies are built optimized in dev builds too: GPUI (its layout, text and rendering) and
# syntect are many times slower unoptimized, which makes `cargo run -p app` feel sluggish, while
# Gitto's own crates stay quick to rebuild. They're built once, then cached like any dependency.
[profile.dev.package."*"]
opt-level = 3
