[workspace]
resolver = "3"
members = ["apps/app", "crates/*"]

[workspace.package]
edition = "2024"
# As rust-toolchain.toml has it.
rust-version = "1.97"

[workspace.dependencies]
gpui-kit = { version = "0.8.0", features = ["gpui-fast"] }

# crates/git: async without tokio (GPUI runs its own executor), with what the features need.
async-channel = "2.5.0"
async-fs = "2.2.0"
async-io = "2.6.0"
async-process = "2.5.0"
blocking = "1.7.0"
dunce = "1.0.5"
event-listener = "5.4.2"
# Without the executor and its thread pool: tasks run on smol's, or the caller's.
futures = { version = "0.3.34", default-features = false, features = ["std", "async-await"] }
futures-lite = "2.6.1"
# Without its tokio stream: read on a thread of its own.
inotify = { version = "0.11.5", default-features = false }
libc = "0.2.191"
log = { version = "0.4.34", features = ["std"] }
memchr = "2.8.3"
notify = "8.2.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = { version = "1.0.1", features = ["std"] }
smol = "2.0.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4", "v7"] }
# Windows only: running git without a console window, in a job object that stops what it started.
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

# crates/db: Gitto's SQLite database, and where it's kept.
dirs = "6.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }

gitto-db = { path = "crates/db" }
