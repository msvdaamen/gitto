[workspace]
resolver = "3"
members = ["apps/app", "crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
gpui-kit = { version = "0.8.0", features = ["gpui-fast"] }

# crates/git: async without tokio (GPUI runs its own executor), with what the features need.
async-channel = "2.5.0"
async-fs = "2.2.0"
async-io = "2.6.0"
async-lock = "3.4.2"
async-process = "2.5.0"
blocking = "1.7.0"
bstr = "1.13.1"
dunce = "1.0.5"
event-listener = "5.4.2"
futures = "0.3.34"
futures-lite = "2.6.1"
libc = "0.2.191"
memchr = "2.8.3"
notify = "8.2.0"
pin-project-lite = "0.2.17"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = { version = "1.0.1", features = ["std"] }
smol = "2.0.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4", "v7"] }

# crates/db: the SQLite database the Electron app shares, and where Electron keeps it.
dirs = "6.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }
sha2 = "0.10.9"

# apps/app: the GPUI app, and the logging it does.
anyhow = "1.0.104"
log = { version = "0.4.34", features = ["std"] }

# apps/app's diffs: syntax highlighting as gpui-kit's `syntect` feature does it (the same syntect
# and syntax set), and the words that changed between a removed line and the line added for it.
similar = "2.7.0"
syntect = { version = "5.3.0", default-features = false, features = [
  "parsing",
  "default-syntaxes",
  "regex-fancy",
] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }

# crates/ui: what the UI works out for itself, e.g. the order of the sidebar's folders.
indexmap = "2.14.2"
url = "2.5.8"

gitto-db = { path = "crates/db" }
gitto-git = { path = "crates/git" }
gitto-repository = { path = "crates/repository" }
gitto-ui = { path = "crates/ui" }
