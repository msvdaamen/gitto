[workspace]
resolver = "3"
members = ["apps/app", "crates/*"]

[workspace.package]
edition = "2024"

[workspace.dependencies]
gpui-kit = { version = "0.8.0", features = ["gpui-fast"] }

# crates/git: async without tokio (GPUI runs its own executor), with what the features need.
async-channel = "2.5.0"
async-fs = "2.2.0"
async-io = "2.6.0"
async-process = "2.5.0"
blocking = "1.7.0"
dunce = "1.0.5"
event-listener = "5.4.2"
futures = "0.3.34"
futures-lite = "2.6.1"
libc = "0.2.191"
memchr = "2.8.3"
notify = "8.2.0"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha1_smol = { version = "1.0.1", features = ["std"] }
smol = "2.0.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
uuid = { version = "1.28.0", features = ["v4", "v7"] }

# crates/db: Gitto's SQLite database, and where it's kept.
dirs = "6.0.0"
rusqlite = { version = "0.40.2", features = ["bundled"] }

# crates/ui: what the UI works out for itself, e.g. the order of the sidebar's folders.
indexmap = "2.14.2"
url = "2.5.8"

gitto-db = { path = "crates/db" }
gitto-git = { path = "crates/git" }
gitto-ui = { path = "crates/ui" }
