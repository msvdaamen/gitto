name: Release

# Every night, the rolling "nightly" pre-release is updated to main, if the code changed since the
# last one. Running it on main by hand builds a nightly now, or releases main with the last
# release's version bumped (1.2.3 to 1.2.4, 1.3.0 or 2.0.0), and pushing a `v1.2.3` tag publishes
# Gitto 1.2.3. The version comes from the tags; package.json's stays at 0.0.0 and is set at build.
#
# Each build publishes changelog.json: its changes since the build before it on its channel, from
# the commits' Conventional Commits titles (see packages/release), added to that build's.
on:
  schedule:
    # Off the hour, when GitHub's busiest delaying scheduled runs.
    - cron: "17 3 * * *"
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      build:
        description: "A nightly, or a release with what goes up: auto from the commits since the last release (feat: minor, fix: patch, !: major), or patch, minor or major"
        type: choice
        options: [nightly, auto, patch, minor, major]
        default: nightly

concurrency:
  # Nightlies, scheduled or run by hand, run one at a time; so do releases run by hand, so each
  # bumps the version the one before released. Every run goes to the end.
  group: ${{ github.workflow }}-${{ (github.event_name == 'schedule' || inputs.build == 'nightly') && 'nightly' || github.ref }}

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      # The release's tag, or `nightly`.
      tag: ${{ steps.version.outputs.tag }}
      # A scheduled nightly with no new code since the last one isn't built.
      skip: ${{ steps.version.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are needed to find the last release, and history for the changelog.
          fetch-depth: 0
      # For packages/release/src/cli.ts, which needs no dependencies.
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - id: version
        env:
          EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          BUILD: ${{ inputs.build }}
        run: |
          # A pre-release part has to start with a letter: Squirrel's NuGet won't take `1.0.0-1`.
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[A-Za-z][0-9A-Za-z-]*(\.[0-9A-Za-z-]+)*)?$'
          if [[ "$EVENT" == workflow_dispatch && ( "$REF_TYPE" != branch || "$REF_NAME" != main ) ]]; then
            echo "::error::Nightlies and releases are made from main, not $REF_NAME."
            exit 1
          fi
          if [[ "$EVENT" == workflow_dispatch && "$BUILD" != nightly ]]; then
            # The highest release, leaving out pre-releases: after 1.2.3 and 1.3.0-rc.1, a minor
            # release is 1.3.0.
            last=$(git tag --list 'v[0-9]*' --sort=-v:refname | sed 's/^v//' \
              | { grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' || true; } | head -n 1)
            bump="$BUILD"
            if [[ "$bump" == auto ]]; then
              bump=$(node packages/release/src/cli.ts bump ${last:+"v$last"})
              echo "The commits since ${last:-the first} make it a $bump release."
            fi
            IFS=. read -r major minor patch <<< "${last:-0.0.0}"
            case "$bump" in
              major) version="$((major + 1)).0.0" ;;
              minor) version="$major.$((minor + 1)).0" ;;
              patch) version="$major.$minor.$((patch + 1))" ;;
            esac
            tag="v$version"
            if git rev-parse -q --verify "refs/tags/$tag" > /dev/null; then
              echo "::error::$tag is already tagged."
              exit 1
            fi
          elif [[ "$REF_TYPE" == tag ]]; then
            tag="$REF_NAME"
            version="${REF_NAME#v}"
            if [[ ! "$version" =~ $semver ]]; then
              echo "::error::$REF_NAME isn't v<major>.<minor>.<patch>, with an optional pre-release part starting with a letter."
              exit 1
            fi
            # Squirrel's NuGet takes a pre-release part of at most 20 characters, without its dots.
            pre="${BASH_REMATCH[4]#-}"
            pre="${pre//./}"
            if (( ${#pre} > 20 )); then
              echo "::error::$REF_NAME's pre-release part is longer than Windows' installer takes: 20 characters, leaving out dots."
              exit 1
            fi
          else
            tag=nightly
            # Scheduled every night, it's only built when the code changed since the last nightly,
            # as a merge that only touches docs doesn't need one.
            if [[ "$EVENT" == schedule ]] && git rev-parse -q --verify refs/tags/nightly > /dev/null \
              && git diff --quiet nightly HEAD -- apps packages package.json pnpm-lock.yaml \
                pnpm-workspace.yaml tsconfig.base.json .github/actions .github/workflows/release.yml
            then
              echo "Nothing to build: the code is as it was in the last nightly."
              echo "skip=true" >> "$GITHUB_OUTPUT"
              exit
            fi
            # The highest release, merged here or not, so a nightly sorts after every release that's
            # out. `versionsort.suffix` puts 1.3.0-rc.1 before 1.3.0.
            last=$(git -c versionsort.suffix=- tag --list 'v[0-9]*' --sort=-v:refname \
              | sed 's/^v//' | { grep -E "$semver" || true; } | head -n 1)
            [[ "${last:=0.0.0}" =~ $semver ]]
            # The minutes from 1970 to when it was built, the same in every build's version. They have
            # 8 digits until 2160, so nightlies sort as they were built as text too, as semver and
            # pacman sort them. With no dots, Windows' installer keeps it whole, and NuGet takes it
            # (at most 20 characters); Squirrel reads the number as an Int32, which it fits.
            nightly="nightly$(( $(date -u +%s) / 60 ))"
            if [[ -n "${BASH_REMATCH[4]}" ]]; then
              # After 1.3.0-rc.1, 1.3.0-nightly…: a pre-release's own part wouldn't fit as well.
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.${BASH_REMATCH[3]}-$nightly"
            else
              # After 1.2.3, 1.2.4-nightly…
              version="${BASH_REMATCH[1]}.${BASH_REMATCH[2]}.$((BASH_REMATCH[3] + 1))-$nightly"
            fi
          fi
          echo "Version $version ($tag)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Changelog
        if: steps.version.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir changelog
          # The build its changes are counted from: the last nightly, or the release before.
          from=$(node packages/release/src/cli.ts previous "$VERSION")
          previous=()
          if [[ -n "$from" ]]; then
            if ! assets=$(gh release view "$from" --json assets --jq '.assets[].name' 2>&1); then
              # A tag whose build failed has no release. Any other failure stops here, rather than
              # start the changelog over.
              [[ "$assets" == "release not found" ]] || { echo "$assets"; exit 1; }
              assets=""
            fi
            # Its changelog, which this one adds to. One published before there were changelogs
            # has none, and the changelog starts over.
            if grep -qx changelog.json <<< "$assets"; then
              gh release download "$from" --pattern changelog.json --output previous.json
              previous=(--previous previous.json)
            fi
          fi
          node packages/release/src/cli.ts generate --version "$VERSION" ${from:+--from "$from"} \
            "${previous[@]}" --out changelog/changelog.json --notes changelog/notes.md
          cat changelog/notes.md >> "$GITHUB_STEP_SUMMARY"
      - if: steps.version.outputs.skip != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: changelog
          path: changelog
          if-no-files-found: error

  build:
    name: Build (${{ matrix.name }})
    needs: version
    if: needs.version.outputs.skip != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: macOS arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          version: ${{ needs.version.outputs.version }}
      - run: pnpm make
      - uses: actions/upload-artifact@v7
        with:
          name: gitto-${{ runner.os }}-${{ runner.arch }}
          # Squirrel's nupkg and RELEASES are what Gitto updates itself from on Windows.
          path: |
            apps/electron/out/make/**/*.zip
            apps/electron/out/make/**/*.exe
            apps/electron/out/make/**/*.nupkg
            apps/electron/out/make/**/RELEASES
          if-no-files-found: error

  build-arch:
    name: Build (Arch Linux x64)
    needs: version
    if: needs.version.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # Without git, checkout downloads the files only.
      - run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          version: ${{ needs.version.outputs.version }}
      - run: pnpm package
      # makepkg won't run as root, and the packaged app is only readable by its owner. The package's
      # dependencies only matter where it's installed.
      - run: |
          useradd --create-home builder
          chown -R builder . ../out
          runuser -u builder -- makepkg --nodeps
        working-directory: apps/electron/arch
      - uses: actions/upload-artifact@v7
        with:
          name: gitto-arch-x64
          path: apps/electron/arch/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, build, build-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: gitto-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: changelog
          path: changelog
      # Named as GitHub would name them (spaces become dots), to tell them from what's already up.
      - run: |
          mkdir upload
          find dist -type f -print0 | while IFS= read -r -d '' file; do
            name=$(basename "$file")
            mv "$file" "upload/${name// /.}"
          done
      # What Gitto checks for updates (see apps/electron/src/updater.ts), kept apart to be uploaded
      # after the files they point to: update.json says the version, RELEASES is Squirrel's on
      # Windows, and update-darwin-arm64.json is Squirrel.Mac's, which points to the zip. With them,
      # changelog.json, which the next build adds to.
      - run: |
          mkdir feeds
          mv upload/RELEASES feeds/
          cp changelog/changelog.json feeds/
          jq -n --arg version "$VERSION" '{version: $version}' > feeds/update.json
          zip=$(cd upload && ls Gitto-darwin-arm64-*.zip)
          jq -n --arg url "https://github.com/$GH_REPO/releases/download/$TAG/$zip" \
            --arg name "$VERSION" '{url: $url, name: $name}' > feeds/update-darwin-arm64.json
      - name: Publish nightly
        if: needs.version.outputs.tag == 'nightly'
        run: |
          # Updated in place, so there's always a nightly to download.
          gh api --method PATCH "repos/$GH_REPO/git/refs/tags/nightly" \
            -f sha="$GITHUB_SHA" -F force=true --silent \
            || gh api "repos/$GH_REPO/git/refs" -f ref=refs/tags/nightly -f sha="$GITHUB_SHA" --silent
          {
            echo "Built from $GITHUB_SHA on main. Nightly builds aren't tested beyond CI."
            echo
            echo "## Since the last nightly"
            echo
            cat changelog/notes.md
          } > notes.md
          if ! gh release view nightly --json id > /dev/null; then
            gh release create nightly upload/* feeds/* --verify-tag --prerelease \
              --title "Gitto Nightly $VERSION" --notes-file notes.md
            exit
          fi
          old=$(gh release view nightly --json assets --jq '.assets[].name')
          gh release upload nightly upload/* --clobber
          gh release upload nightly feeds/* --clobber
          gh release edit nightly --prerelease --title "Gitto Nightly $VERSION" --notes-file notes.md
          # The last build's files.
          while IFS= read -r name; do
            [[ -z "$name" || -e "upload/$name" || -e "feeds/$name" ]] \
              || gh release delete-asset nightly "$name" --yes
          done <<< "$old"
      - name: Publish release
        if: needs.version.outputs.tag != 'nightly'
        run: |
          # A release run by hand is tagged only now that it's built, so a failed build leaves no
          # tag. Made with this token, the tag doesn't start this workflow again.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" --silent
          fi
          # A tag like v1.0.0-beta.1 is published as a pre-release.
          prerelease=$([[ "$VERSION" == *-* ]] && echo --prerelease || true)
          # Its files are all up before it's published, so update.json never points to a missing one.
          gh release create "$TAG" upload/* feeds/* $prerelease \
            --verify-tag --title "Gitto $VERSION" --notes-file changelog/notes.md
