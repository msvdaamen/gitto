name: Release

# Every merge to main replaces the rolling "nightly" pre-release; pushing a `v1.2.3` tag publishes
# Gitto 1.2.3. The version comes from the tags; package.json's stays at 0.0.0 and is set at build.
on:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer merge makes the running nightly stale; a release always runs to the end.
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

permissions:
  contents: read

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Tags are needed to find the last release.
          fetch-depth: 0
      - id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          semver='^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$'
          if [[ "$REF_TYPE" == tag ]]; then
            version="${REF_NAME#v}"
            [[ "$version" =~ $semver ]] || { echo "::error::$REF_NAME isn't a v<semver> tag."; exit 1; }
          else
            last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' 2>/dev/null || echo v0.0.0)
            [[ "${last#v}" =~ $semver ]] || { echo "::error::$last isn't a v<semver> tag."; exit 1; }
            major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]}
            # After 1.2.3 the next release is 1.2.4 at least; after 1.3.0-beta.1 it's 1.3.0.
            [[ -n "${BASH_REMATCH[4]}" ]] || patch=$((patch + 1))
            version="$major.$minor.$patch-nightly.$(date -u +%Y%m%d).$RUN_NUMBER"
          fi
          echo "Version $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows x64, os: windows-latest }
          - { name: macOS arm64, os: macos-latest }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm pkg set "version=${{ needs.version.outputs.version }}"
        working-directory: apps/electron
      - run: pnpm make
      - uses: actions/upload-artifact@v7
        with:
          name: gitto-${{ runner.os }}-${{ runner.arch }}
          # Squirrel's nupkg and RELEASES only matter to an update server, which there isn't.
          path: |
            apps/electron/out/make/**/*.zip
            apps/electron/out/make/**/*.exe
          if-no-files-found: error

  build-arch:
    name: Build (Arch Linux x64)
    needs: version
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      # Without git, checkout downloads the files only.
      - run: pacman -Syu --noconfirm --needed git
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm pkg set "version=${{ needs.version.outputs.version }}"
        working-directory: apps/electron
      - run: pnpm package
      # makepkg won't run as root, and the PKGBUILD needs setup-node's node from PATH. The package's
      # dependencies only matter where it's installed.
      - run: |
          useradd --create-home builder
          chown -R builder .
          runuser -u builder -- env "PATH=$PATH" makepkg --nodeps
        working-directory: apps/electron/arch
      - uses: actions/upload-artifact@v7
        with:
          name: gitto-arch-x64
          path: apps/electron/arch/*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: Publish
    needs: [version, build, build-arch]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Publish nightly
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Recreated rather than updated, so the old build's files go and the tag moves to this commit.
          gh release delete nightly --cleanup-tag --yes || true
          find dist -type f -print0 | xargs -0 gh release create nightly \
            --prerelease --target "$GITHUB_SHA" --title "Nightly $VERSION" \
            --notes "Built from $GITHUB_SHA on main. Nightly builds aren't tested beyond CI."
      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # A tag like v1.0.0-beta.1 is published as a pre-release.
          prerelease=$([[ "$VERSION" == *-* ]] && echo --prerelease || true)
          find dist -type f -print0 | xargs -0 gh release create "$GITHUB_REF_NAME" $prerelease \
            --verify-tag --title "Gitto $VERSION" --generate-notes
