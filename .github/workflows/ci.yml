name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint --format github
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  # Formatting needs no build, so it gets no cache or system libraries and fails within seconds.
  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Clippy and the tests build different things (clippy only checks the dependencies, the tests
  # compile them), so they run side by side, each with its own cache.
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    env:
      # CI never runs a debugger, and debug info only slows the build, the linking and the cache.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      # The dependencies' build, kept between runs: keyed by the job, the toolchain and Cargo.lock,
      # and restored from the closest match when those changed. A pull request restores its own
      # cache, or else main's; base branches that aren't main never save one, as CI only runs on
      # push to main. The workspace's crates are left out, as they're the ones that change.
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p gitto-git --all-targets --locked -- -D warnings

  rust-test:
    name: Rust test
    runs-on: ubuntu-latest
    env:
      # CI never runs a debugger, and debug info only slows the build, the linking and the cache.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      # Cached as in rust-lint.
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p gitto-git --locked
