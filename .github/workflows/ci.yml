name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint --format github
      - run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm test

  # Formatting needs no build, so it gets no cache or system libraries and fails within seconds.
  # The Rust jobs install the Rust that rust-toolchain.toml has: change them with it.
  rust-format:
    name: Rust format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # Clippy and the tests build different things (clippy only checks the dependencies, the tests
  # compile them), so they run side by side, each with its own cache.
  rust-lint:
    name: Rust lint
    runs-on: ubuntu-latest
    env:
      # CI never runs a debugger, and debug info only slows the build, the linking and the cache.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      # The dependencies' build, kept between runs: keyed by the job, the toolchain and Cargo.lock,
      # and restored from the closest match when those changed. Only main's is saved, which pull
      # requests restore: each pull request's own, about a gigabyte, would soon fill the
      # repository's cache space. The workspace's crates are left out, as they're the ones that
      # change.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --exclude app --all-targets --locked -- -D warnings
      # Without the tests, and the features their dev-dependencies turn on (`test-support`), as
      # the app is built: code that only builds with those fails here.
      - run: cargo clippy --workspace --exclude app --locked -- -D warnings

  rust-test:
    name: Rust test
    runs-on: ubuntu-latest
    env:
      # CI never runs a debugger, and debug info only slows the build, the linking and the cache.
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
      # Cached as in rust-lint.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --exclude app --locked

  # The code that's only built for Windows or macOS (running git there, say), linted and tested on
  # each, as Gitto ships for both. In one job each, as their runners take longer to start.
  rust-platforms:
    name: Rust (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      # Cached as in rust-lint.
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo clippy --workspace --exclude app --all-targets --locked -- -D warnings
      - run: cargo test --workspace --exclude app --locked

  # Known vulnerabilities in the Rust dependencies, and ones that are unmaintained or yanked, from
  # RustSec's advisories (see deny.toml). Needs no build.
  rust-advisories:
    name: Rust advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories
