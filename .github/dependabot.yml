# Pull requests that update the dependencies Dependabot can update: the Rust crates (Cargo.lock)
# and the workflows' actions. Once a month, each kind in one pull request, as most are small.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      cargo:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
