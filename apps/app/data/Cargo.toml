[package]
name = "gitto-app-data"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
description = "Gitto app's data layer, services and state: what the GPUI UI shows, loaded off the main thread."
publish = false

[features]
# What tests set up a repository's data with (`Repository::set_status`, `Repositories::insert`,
# …), for the app's tests too.
test-support = []

[dependencies]
gpui-kit.workspace = true

# What the UI shows and changes, called directly (there's no RPC).
gitto-db.workspace = true
gitto-git.workspace = true
gitto-repository.workspace = true
gitto-ui-logic.workspace = true

anyhow.workspace = true
async-fs.workspace = true
chrono.workspace = true
futures.workspace = true
log.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
gitto-git = { workspace = true, features = ["test-support"] }
gpui-kit = { workspace = true, features = ["test-support"] }
smol.workspace = true
tempfile.workspace = true
