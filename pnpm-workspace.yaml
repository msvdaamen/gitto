packages:
  - apps/*
  - packages/*

# oRPC packages must stay on the same version; packages reference these with "catalog:".
catalog:
  "@orpc/client": "^1.15.4"
  "@orpc/contract": "^1.15.4"
  "@orpc/server": "^1.15.4"
  zod: "^4.6.5"
  drizzle-orm: "1.0.0-rc.4"
  drizzle-kit: "1.0.0-rc.4"

# pnpm's default, set explicitly so Electron Forge's package manager check passes.
# The Electron app is fully bundled by Vite (Forge only packages the .vite folder),
# so it ships no node_modules and doesn't need `nodeLinker: hoisted`.
hoistPattern:
  - "*"

allowBuilds:
  electron-winstaller: true
  esbuild: true

overrides:
  # Forge 7 depends on @electron/rebuild@3, which pulls node-gyp from a git repo
  # (blocked by pnpm's blockExoticSubdeps). v4 uses the npm-published node-gyp.
  "@electron/rebuild": ^4.2.0
  # extract-zip@2 (yauzl@2) silently stops mid-extraction on Node 26, which makes
  # `electron-forge package` exit early. Electron's own drop-in replacement works.
  extract-zip: npm:@electron-internal/extract-zip@^1.0.5
