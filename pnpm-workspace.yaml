packages:
  - apps/*
  - packages/*

# Versions shared across packages (oRPC must stay in lockstep); packages reference these with "catalog:".
catalog:
  "@orpc/client": "^1.15.4"
  "@orpc/contract": "^1.15.4"
  "@orpc/server": "^1.15.4"
  zod: "^4.6.5"
  drizzle-orm: "1.0.0-rc.4"
  drizzle-kit: "1.0.0-rc.4"
  vitest: "^5.0.2"

# pnpm's default, set explicitly so Electron Forge's package manager check passes.
# The Electron app is bundled by Vite (Forge only packages the .vite folder); the few
# native modules it ships are copied in by forge.config.ts, so it doesn't need `nodeLinker: hoisted`.
hoistPattern:
  - "*"

allowBuilds:
  electron-winstaller: true
  esbuild: true
  # Only builds from source when asked to; the prebuilt binaries come as optional dependencies.
  "@parcel/watcher": false

overrides:
  # Forge 7 depends on @electron/rebuild@3, which pulls node-gyp from a git repo
  # (blocked by pnpm's blockExoticSubdeps). v4 uses the npm-published node-gyp.
  "@electron/rebuild": ^4.2.0
  # extract-zip@2 (yauzl@2) silently stops mid-extraction on Node 26, which makes
  # `electron-forge package` exit early. Electron's own drop-in replacement works.
  extract-zip: npm:@electron-internal/extract-zip@^1.0.5
